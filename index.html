<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gaziemir Döner</title>
<style>
    body { font-family: sans-serif; padding: 10px; background-color: #f4f4f4; }
    .kart { background: white; border-radius: 10px; padding: 15px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .urun-ust { display: flex; justify-content: space-between; align-items: center; }
    .buton-grubu { display: flex; align-items: center; gap: 10px; }
    button { width: 40px; height: 40px; border-radius: 5px; border: none; background: #e74c3c; color: white; font-size: 20px; }
    .not-kutusu { width: 100%; margin-top: 10px; padding: 8px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
    .toplam { font-size: 1.3rem; font-weight: bold; margin-top: 20px; padding: 10px; background: #fff; border-radius: 10px; text-align: center;}
    .siparis-btn { width: 100%; padding: 15px; background: #25d366; color: white; border: none; border-radius: 10px; font-size: 1.2rem; margin-top: 10px; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>

    <h2 style="text-align:center;">🔥 Gaziemir Döner 🔥</h2>

    <div id="liste">
        <script>
            const urunler = [
                {ad: "Tavuk Döner Dürüm", fiyat: 150},
                {ad: "Yarım Ekmek Tavuk", fiyat: 150},
                {ad: "Üç Parça Tavuk", fiyat: 220},
                {ad: "Üç Parça Et", fiyat: 350},
                {ad: "Et İskender", fiyat: 450},
                {ad: "Tavuk İskender", fiyat: 300},
                {ad: "Kutu Kola", fiyat: 60},
                {ad: "Kutu Fanta", fiyat: 60},
                {ad: "Fuse Tea", fiyat: 60},
                {ad: "Sprite", fiyat: 60},
                {ad: "Huzur Gazoz", fiyat: 40},
                {ad: "Niğde Gazoz", fiyat: 40},
                {ad: "Şalgam (Acılı)", fiyat: 40},
                {ad: "Şalgam (Acısız)", fiyat: 40}
            ];
            
            urunler.forEach((u, i) => {
                document.write(`
                    <div class="kart">
                        <div class="urun-ust">
                            <div><strong>${u.ad}</strong><br>${u.fiyat} TL</div>
                            <div class="buton-grubu">
                                <button onclick="hesapla(${i}, -1, ${u.fiyat})">-</button>
                                <span id="adet_${i}">0</span>
                                <button onclick="hesapla(${i}, 1, ${u.fiyat})">+</button>
                            </div>
                        </div>
                        <input type="text" class="not-kutusu" id="not_${i}" placeholder="Not (Soğan yok, ketçaplı...)">
                    </div>
                `);
            });
        </script>
    </div>

    <div class="toplam">Toplam: <span id="toplam">0</span> TL</div>
    <button class="siparis-btn" onclick="siparisGonder()">Siparişi WhatsApp ile Gönder</button>

<script>
    let toplam = 0;
    let adetler = new Array(14).fill(0);
    
    function hesapla(id, miktar, fiyat) {
        adetler[id] = Math.max(0, adetler[id] + miktar);
        document.getElementById('adet_' + id).innerText = adetler[id];
        toplam = Math.max(0, toplam + (miktar * fiyat));
        document.getElementById('toplam').innerText = toplam;
    }

    function siparisGonder() {
        let mesaj = "Siparişlerim:%0A";
        for(let i=0; i<14; i++) {
            if(adetler[i] > 0) {
                let not = document.getElementById('not_'+i).value;
                mesaj += adetler[i] + " adet " + urunler[i].ad + (not ? " (" + not + ")" : "") + "%0A";
            }
        }
        mesaj += "%0AToplam: " + toplam + " TL";
        window.open("https://wa.me/905078073532?text=" + mesaj);
    }
</script>
</body>
</html>
