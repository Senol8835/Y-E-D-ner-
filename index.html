<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gaziemir Döner</title>
<style>
    body { font-family: sans-serif; padding: 10px; background-color: #f4f4f4; }
    .kart { background: white; border-radius: 10px; padding: 15px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .urun-ust { display: flex; justify-content: space-between; align-items: center; }
    .buton-grubu { display: flex; align-items: center; gap: 10px; }
    button { width: 40px; height: 40px; border-radius: 5px; border: none; background: #e74c3c; color: white; font-size: 20px; }
    .not-kutusu { width: 100%; margin-top: 10px; padding: 8px; border: 1px solid #ddd; border-radius: 5px; }
    .toplam { font-size: 1.2rem; font-weight: bold; margin-top: 20px; }
</style>
</head>
<body>

    <h2 style="text-align:center;">🔥 Gaziemir Döner 🔥</h2>

    <!-- Ürün Şablonu (Bu yapıyı istediğin ürüne uyguladım) -->
    <div class="kart">
        <div class="urun-ust">
            <div><strong>Tavuk Döner Dürüm</strong><br>150 TL</div>
            <div class="buton-grubu">
                <button onclick="degistir('Tavuk_Dürüm', 150, -1)">-</button>
                <span id="adet_Tavuk_Dürüm">0</span>
                <button onclick="degistir('Tavuk_Dürüm', 150, 1)">+</button>
            </div>
        </div>
        <input type="text" class="not-kutusu" placeholder="Not (Soğan yok, ketçaplı...)">
    </div>

    <!-- Diğer ürünleri de aynı kart içine alacağız. Şimdilik temel yapıyı kurdum. -->
    <div class="toplam">Sepet Toplamı: <span id="toplam">0</span> TL</div>

<script>
    let sepet = {};
    let toplam = 0;
    function degistir(urun, fiyat, miktar) {
        if (!sepet[urun]) sepet[urun] = 0;
        sepet[urun] = Math.max(0, sepet[urun] + miktar);
        document.getElementById('adet_' + urun).innerText = sepet[urun];
        toplam = Math.max(0, toplam + (miktar * fiyat));
        document.getElementById('toplam').innerText = toplam;
    }
</script>
</body>
</html>
