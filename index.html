<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Sipariş Sayfası</title>
<style>
    body { font-family: sans-serif; padding: 10px; }
    .kart { border: 1px solid #ddd; padding: 10px; margin-bottom: 10px; }
    .urun-ust { display: flex; justify-content: space-between; align-items: center; }
    .not-kutusu { width: 100%; padding: 5px; margin-top: 5px; box-sizing: border-box; }
    .toplam-alan { font-size: 1.5rem; font-weight: bold; margin-top: 20px; padding: 10px; border-top: 2px solid #000; }
</style>
</head>
<body>

    <!-- Ürünler -->
    <div class="kart">
        <div class="urun-ust"><h3>Tavuk Döner Dürüm</h3><span>150 TL</span><button onclick="ekle('Tavuk Döner Dürüm', 150)">+</button></div>
        <input type="text" class="not-kutusu" placeholder="Not (Soğanlı, Ketçap vb.)">
    </div>
    <div class="kart">
        <div class="urun-ust"><h3>Yarım Ekmek Tavuk Döner</h3><span>150 TL</span><button onclick="ekle('Yarım Ekmek Tavuk', 150)">+</button></div>
        <input type="text" class="not-kutusu" placeholder="Not (Soğanlı, Ketçap vb.)">
    </div>
    <div class="kart"><div class="urun-ust"><h3>Üç Parça Tavuk</h3><span>220 TL</span><button onclick="ekle('Üç Parça Tavuk', 220)">+</button></div></div>
    <div class="kart"><div class="urun-ust"><h3>Üç Parça Et</h3><span>350 TL</span><button onclick="ekle('Üç Parça Et', 350)">+</button></div></div>
    <div class="kart"><div class="urun-ust"><h3>Et İskender</h3><span>450 TL</span><button onclick="ekle('Et İskender', 450)">+</button></div></div>
    <div class="kart"><div class="urun-ust"><h3>Buçuk Et İskender</h3><span>650 TL</span><button onclick="ekle('Buçuk Et İskender', 650)">+</button></div></div>
    <div class="kart"><div class="urun-ust"><h3>Tavuk İskender</h3><span>300 TL</span><button onclick="ekle('Tavuk İskender', 300)">+</button></div></div>
    <div class="kart"><div class="urun-ust"><h3>Buçuk Tavuk İskender</h3><span>450 TL</span><button onclick="ekle('Buçuk Tavuk İskender', 450)">+</button></div></div>

    <div style="font-weight: bold; margin-top: 20px;">İçecekler</div>
    <div class="kart"><div class="urun-ust"><h3>Kutu Kola</h3><span>60 TL</span><button onclick="ekle('Kutu Kola', 60)">+</button></div></div>
    <div class="kart"><div class="urun-ust"><h3>Kutu Fanta</h3><span>60 TL</span><button onclick="ekle('Kutu Fanta', 60)">+</button></div></div>
    <div class="kart"><div class="urun-ust"><h3>Şalgam (Acılı)</h3><span>40 TL</span><button onclick="ekle('Şalgam (Acılı)', 40)">+</button></div></div>

    <!-- Toplam Hesaplama -->
    <div class="toplam-alan">Toplam: <span id="toplam">0</span> TL</div>

<script>
    let toplam = 0;
    function ekle(urun, fiyat) {
        toplam += fiyat;
        document.getElementById('toplam').innerText = toplam;
        alert(urun + " sepete eklendi!");
    }
</script>
</body>
</html>
