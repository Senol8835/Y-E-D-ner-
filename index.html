<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gaziemir Döner</title>
<style>
    body { font-family: sans-serif; padding: 10px; background-color: #f4f4f4; }
    .kart { background: white; border-radius: 10px; padding: 15px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .urun-ust { display: flex; justify-content: space-between; align-items: center; }
    .buton-grubu { display: flex; align-items: center; gap: 10px; }
    button { width: 40px; height: 40px; border-radius: 5px; border: none; background: #e74c3c; color: white; font-size: 20px; }
    .not-kutusu { width: 100%; margin-top: 10px; padding: 8px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
    .toplam { font-size: 1.3rem; font-weight: bold; margin-top: 20px; padding: 10px; background: #fff; border-radius: 10px; text-align: center;}
</style>
</head>
<body>

    <h2 style="text-align:center;">🔥 Gaziemir Döner 🔥</h2>

    <!-- Ürünler -->
    <div id="liste">
        <div class="kart"><div class="urun-ust"><div><strong>Tavuk Döner Dürüm</strong><br>150 TL</div><div class="buton-grubu"><button onclick="hesapla('Tavuk Döner Dürüm', 150, -1)">-</button><span id="adet_Tavuk Döner Dürüm">0</span><button onclick="hesapla('Tavuk Döner Dürüm', 150, 1)">+</button></div></div><input type="text" class="not-kutusu" placeholder="Not (Soğan yok...)"></div>
        <div class="kart"><div class="urun-ust"><div><strong>Yarım Ekmek Tavuk</strong><br>150 TL</div><div class="buton-grubu"><button onclick="hesapla('Yarım Ekmek Tavuk', 150, -1)">-</button><span id="adet_Yarım Ekmek Tavuk">0</span><button onclick="hesapla('Yarım Ekmek Tavuk', 150, 1)">+</button></div></div><input type="text" class="not-kutusu" placeholder="Not..."></div>
        <div class="kart"><div class="urun-ust"><div><strong>Üç Parça Tavuk</strong><br>220 TL</div><div class="buton-grubu"><button onclick="hesapla('Üç Parça Tavuk', 220, -1)">-</button><span id="adet_Üç Parça Tavuk">0</span><button onclick="hesapla('Üç Parça Tavuk', 220, 1)">+</button></div></div></div>
        <div class="kart"><div class="urun-ust"><div><strong>Üç Parça Et</strong><br>350 TL</div><div class="buton-grubu"><button onclick="hesapla('Üç Parça Et', 350, -1)">-</button><span id="adet_Üç Parça Et">0</span><button onclick="hesapla('Üç Parça Et', 350, 1)">+</button></div></div></div>
        <div class="kart"><div class="urun-ust"><div><strong>Et İskender</strong><br>450 TL</div><div class="buton-grubu"><button onclick="hesapla('Et İskender', 450, -1)">-</button><span id="adet_Et İskender">0</span><button onclick="hesapla('Et İskender', 450, 1)">+</button></div></div></div>
        <div class="kart"><div class="urun-ust"><div><strong>Tavuk İskender</strong><br>300 TL</div><div class="buton-grubu"><button onclick="hesapla('Tavuk İskender', 300, -1)">-</button><span id="adet_Tavuk İskender">0</span><button onclick="hesapla('Tavuk İskender', 300, 1)">+</button></div></div></div>
        <div class="kart"><div class="urun-ust"><div><strong>Kutu Kola</strong><br>60 TL</div><div class="buton-grubu"><button onclick="hesapla('Kutu Kola', 60, -1)">-</button><span id="adet_Kutu Kola">0</span><button onclick="hesapla('Kutu Kola', 60, 1)">+</button></div></div></div>
    </div>

    <div class="toplam">Sepet Toplamı: <span id="toplam">0</span> TL</div>

<script>
    let toplam = 0;
    function hesapla(isim, fiyat, miktar) {
        let span = document.getElementById('adet_' + isim);
        let mevcutAdet = parseInt(span.innerText);
        let yeniAdet = Math.max(0, mevcutAdet + miktar);
        
        span.innerText = yeniAdet;
        toplam = Math.max(0, toplam + (miktar * fiyat));
        document.getElementById('toplam').innerText = toplam;
    }
</script>
</body>
</html>
